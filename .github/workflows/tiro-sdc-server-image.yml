name: tiro-sdc-server-image

# Build and publish ghcr.io/hl7-be/tiro-sdc-server as a multi-arch image.
# The license JWT comes from the `SDC_SERVER_LICENSE` repo secret and is
# passed straight to BuildKit as a build-time secret — it never touches
# disk in the runner.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/tiro_sdc_server/**'
      - '.github/workflows/tiro-sdc-server-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hl7-be/tiro-sdc-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: apps/tiro_sdc_server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            license=${{ secrets.SDC_SERVER_LICENSE }}
