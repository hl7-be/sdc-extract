[project]
name = "tiro-sdc-extract"
version = "0.1.0"
description = "Standalone FHIR SDC $extract service (definition-based extraction)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn",
    "python-dotenv",
    "fhir-sdc",
]

[tool.uv]
managed = true

[tool.uv.sources]
fhir-sdc = { git = "ssh://git@github.com/tiro-health/fhir-sdc-rs.git", tag = "v0.1.0-rc3" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
