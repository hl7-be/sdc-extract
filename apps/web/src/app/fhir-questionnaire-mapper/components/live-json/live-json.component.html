<div class="card shadow-sm mt-4" *ngIf="questionnaire">
  <div class="card-header bg-light d-flex justify-content-between align-items-center" style="cursor: pointer" (click)="toggle()">
    <h5 class="mb-0">JSON Output</h5>
    <div class="d-flex align-items-center gap-2">
      <button *ngIf="!isCollapsed" type="button" class="btn btn-sm btn-outline-secondary" (click)="refreshQr($event)"
        title="{{ 'wizard.reread-qr' | translate }}">
        &#x21BB; Refresh QR
      </button>
      <small>{{ isCollapsed ? '&#9660;' : '&#9650;' }}</small>
    </div>
  </div>

  <div class="card-body p-0" *ngIf="!isCollapsed">
    <div class="d-flex" style="min-width: 0">
      <div class="d-flex flex-column border-end" style="flex: 1; min-width: 0">
        <div class="px-3 py-2 bg-light border-bottom d-flex justify-content-between align-items-center">
          <small class="fw-bold text-muted text-uppercase">Questionnaire</small>
          <small class="text-muted">{{ questionnaire?.id }}</small>
        </div>
        <pre class="overflow-auto m-0 p-3 small" style="max-height: 600px; background: #fafafa">{{ questionnaire | json }}</pre>
      </div>

      <div class="d-flex flex-column" style="flex: 1; min-width: 0">
        <div class="px-3 py-2 bg-light border-bottom d-flex justify-content-between align-items-center">
          <small class="fw-bold text-muted text-uppercase">QuestionnaireResponse</small>
          <small *ngIf="!questionnaireResponse" class="text-muted fst-italic">
            {{ 'wizard.refresh-qr' | translate }}
          </small>
          <small *ngIf="questionnaireResponse" class="text-muted">{{ questionnaireResponse?.status }}</small>
        </div>
        <pre class="overflow-auto m-0 p-3 small" style="max-height: 600px; background: #fafafa">{{ questionnaireResponse | json }}</pre>
      </div>
    </div>
  </div>
</div>
