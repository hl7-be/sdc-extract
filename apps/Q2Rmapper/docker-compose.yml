services:
  q2rmapper:
    build:
      context: ../..
      dockerfile: apps/Q2Rmapper/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./api/.env
        required: false
    environment:
      # Fallback only -- api/.env takes precedence for all other vars
      - FHIR_BASE_URL=${FHIR_BASE_URL:-https://hapi.fhir.org/baseR4}